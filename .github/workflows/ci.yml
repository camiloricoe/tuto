name: CI

on:
  pull_request:
  push:
    branches: [main, 'phase/**']
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  test-unit:
    runs-on: ubuntu-latest
    outputs:
      duration_ms: ${{ steps.timer.outputs.duration_ms }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: timer
        run: |
          start=$(date +%s%3N)
          pnpm test:json
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results
          path: vitest-results.json
          retention-days: 7

  test-e2e:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-unit]
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.message, '[e2e]')
    outputs:
      duration_ms: ${{ steps.timer.outputs.duration_ms }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E suite
        id: timer
        env:
          TEST_URL: ${{ secrets.E2E_URL || 'https://tuto-flame.vercel.app' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          start=$(date +%s%3N)
          pnpm test:e2e || true
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  health-ingest:
    name: Ingest results to Health endpoint
    runs-on: ubuntu-latest
    needs: [test-unit, test-e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: vitest-results
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
        continue-on-error: true
      - name: POST to /api/health/test-run
        env:
          HEALTH_INGEST_TOKEN: ${{ secrets.HEALTH_INGEST_TOKEN }}
          HEALTH_TARGET: ${{ secrets.E2E_URL || 'https://tuto-flame.vercel.app' }}
        run: |
          if [ -z "$HEALTH_INGEST_TOKEN" ]; then
            echo "HEALTH_INGEST_TOKEN secret not set, skipping ingest"
            exit 0
          fi
          pnpm test:ingest \
            --duration-ms ${{ needs.test-unit.outputs.duration_ms || 0 }} \
            --source ${{ github.event_name == 'schedule' && 'cron' || (github.event_name == 'pull_request' && 'pr' || 'deploy') }}
